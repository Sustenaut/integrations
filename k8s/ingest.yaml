# The ingest pod: each project's buffer in storage, into BigQuery every two minutes. One
# replica, as one writer per table keeps a table within BigQuery's daily load jobs; to
# scale, more pods split by dataset. Nothing sends to it, so it has no Service; its
# only route is /healthz. Its key is the Secret admin/push-ingest-key.sh puts in.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: integrations-ingest
  template:
    metadata:
      labels:
        app: integrations-ingest
    spec:
      serviceAccountName: ingest
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingest
          image: ghcr.io/sustenaut/sustenaut-integrations
          command: ["uvicorn", "integrations.ingest.main:app", "--host", "0.0.0.0", "--port", "8080", "--no-server-header"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: INGEST_KEY_FILE
              value: /keys/key.json
            - name: INGEST_STORAGE_URL
              value: https://storage.sustenaut.eu
            - name: INGEST_STORAGE_TOKEN_FILE
              value: /var/run/secrets/storage.sustenaut.eu/token
          envFrom:
            - configMapRef:
                name: ingest-settings
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: key
              mountPath: /keys
              readOnly: true
            - name: storage-token
              mountPath: /var/run/secrets/storage.sustenaut.eu
              readOnly: true
      volumes:
        - name: key
          secret:
            secretName: ingest-bigquery-key
        - name: storage-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: storage.sustenaut.eu
                  path: token
                  expirationSeconds: 3600
