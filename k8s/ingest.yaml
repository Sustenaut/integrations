# The ingest pod: each project's buffer in storage, into BigQuery as storage tells of its
# files, and in a sweep every INGEST_SWEEP_SECONDS. One replica, as one writer per table
# keeps a table within BigQuery's daily load jobs; to scale, more pods split by dataset.
# Its Service takes storage's notices, POST /ingest/notify through the Ingress, signed
# with INGEST_NOTIFY_KEY (the Secret ingest-notify; without it every notice is refused),
# and Kubernetes' probes. It reaches BigQuery with no key, through Workload Identity
# (google-credential.yaml).
apiVersion: v1
kind: Service
metadata:
  name: ingest
spec:
  selector:
    app: integrations-ingest
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: integrations-ingest
  template:
    metadata:
      labels:
        app: integrations-ingest
    spec:
      serviceAccountName: ingest
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingest
          image: ghcr.io/sustenaut/sustenaut-integrations
          command: ["uvicorn", "integrations.ingest.main:app", "--host", "0.0.0.0", "--port", "8080", "--no-server-header"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: INGEST_KEY_FILE
              value: /etc/google/credential.json
            - name: INGEST_STORAGE_URL
              value: https://storage.sustenaut.eu
            - name: INGEST_STORAGE_TOKEN_FILE
              value: /var/run/secrets/storage.sustenaut.eu/token
            - name: INGEST_NOTIFY_KEY
              valueFrom:
                secretKeyRef:
                  name: ingest-notify
                  key: key
                  optional: true
          envFrom:
            - configMapRef:
                name: ingest-settings
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Unready once the scanner has gone three intervals without finishing a pass.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: google-token
              mountPath: /var/run/secrets/google
              readOnly: true
            - name: google-credential
              mountPath: /etc/google
              readOnly: true
            - name: storage-token
              mountPath: /var/run/secrets/storage.sustenaut.eu
              readOnly: true
      volumes:
        - name: google-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "//iam.googleapis.com/projects/948171295184/locations/global/workloadIdentityPools/services/providers/sustenaut-k3s"
                  path: token
                  expirationSeconds: 3600
        - name: google-credential
          configMap:
            name: google-credential
        - name: storage-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: storage.sustenaut.eu
                  path: token
                  expirationSeconds: 600
