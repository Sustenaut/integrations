# The integrations service on the shared k3s server, namespace integrations.
# Rendered by .github/workflows/deploy.yml, which sets the image it just built and
# the settings a deployment names, and applied by sustenaut-deploy on the server.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: integrations
resources:
  - service-accounts.yaml
  - app.yaml
  - ingest.yaml
  - ingress.yaml
# The app's hardening and probes, shared by every service (pubkit's README, "Deploying a
# service to k3s"). The ingest pod keeps its own, in ingest.yaml.
components:
  - https://github.com/Sustenaut/pubkit//k8s/components/app?ref=1499dba4482c50463e54be1ded1d85d07151e00b # v0.30.0
images:
  - name: ghcr.io/sustenaut/sustenaut-integrations
    newTag: unset
