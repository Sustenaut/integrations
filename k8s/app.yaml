# One replica: the rate limit is held in memory. It keeps nothing on disk and holds
# no credentials, since a person's token comes with each request and is forgotten.
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: integrations
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integrations
  template:
    metadata:
      labels:
        app: integrations
    spec:
      serviceAccountName: app
      # Its hardening and probes come from pubkit's app component (kustomization.yaml).
      containers:
        - name: app
          image: ghcr.io/sustenaut/sustenaut-integrations
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: INTEGRATIONS_STORAGE_URL
              value: https://storage.sustenaut.eu
            - name: INTEGRATIONS_STORAGE_TOKEN_FILE
              value: /var/run/secrets/storage.sustenaut.eu/token
          envFrom:
            - configMapRef:
                name: settings
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: storage-token
              mountPath: /var/run/secrets/storage.sustenaut.eu
              readOnly: true
      volumes:
        # Only for the call log's buffers in the storage service, as this pod's own identity.
        - name: storage-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: storage.sustenaut.eu
                  path: token
                  expirationSeconds: 600
