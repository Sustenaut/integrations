# One replica: the rate limit is held in memory. It keeps nothing on disk and holds
# no credentials, since a person's token comes with each request and is forgotten.
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: integrations
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integrations
  template:
    metadata:
      labels:
        app: integrations
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/sustenaut/sustenaut-integrations
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: INTEGRATIONS_INGEST_URL
              value: http://ingest:8080
          envFrom:
            - configMapRef:
                name: settings
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
