# No pod here gets a Kubernetes API token: the service never talks to the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
automountServiceAccountToken: false
---
# The ingest pod's identity for its overflow tenants in the storage service.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingest
automountServiceAccountToken: false
---
# The namespace's default account: no pod here gets an API token by accident, such as
# the page and the sign-in proxy, which name no account of their own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
automountServiceAccountToken: false
