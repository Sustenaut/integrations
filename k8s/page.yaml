# The call log's page at /logging, in its own pod with a key that can only read, so the
# public service never holds it. oauth2-proxy signs people in with the team realm, as the
# client sustenaut.eu registered (admin/register-logging-client.sh), and lets in only
# people holding the integrations role, which arrives in the client's access claim. Nothing
# else reaches the page: admin/network-policy.yaml lets in only the proxy's pods, and the
# ingress routes only /logging to the proxy. The cookie stays under /logging.
apiVersion: v1
kind: Service
metadata:
  name: page
spec:
  selector:
    app: integrations-page
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integrations-page
  template:
    metadata:
      labels:
        app: integrations-page
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: page
          image: ghcr.io/sustenaut/sustenaut-integrations
          command: ["uvicorn", "integrations.page.main:app", "--host", "0.0.0.0", "--port", "8080", "--no-server-header"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PAGE_KEY_FILE
              value: /keys/key.json
            - name: PAGE_BASE
              value: /logging
          envFrom:
            - configMapRef:
                name: page-settings
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: key
              mountPath: /keys
              readOnly: true
      volumes:
        - name: key
          secret:
            secretName: page-bigquery-key
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
spec:
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 4180
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://auth.sustenaut.eu/realms/team
            - --code-challenge-method=S256
            - --scope=openid email profile
            - --http-address=0.0.0.0:4180
            - --upstream=http://page:8080/
            - --proxy-prefix=/logging/oauth2
            - --redirect-url=https://integrations.sustenaut.eu/logging/oauth2/callback
            - --reverse-proxy=true
            - --email-domain=*
            - --oidc-groups-claim=access
            - --allowed-group=integrations
            - --cookie-refresh=4m
            - --cookie-name=_integrations_logging
            - --cookie-path=/logging
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --skip-provider-button=true
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: integrations-oidc
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: integrations-oidc
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: logging-cookie-secret
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
