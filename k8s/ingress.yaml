# integrations.sustenaut.eu through the server's shared Traefik, with a Let's
# Encrypt certificate. /logging, the call log's page, goes through the sign-in proxy.
# Everything else is the service's public API, with no sign-in in front of it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: integrations
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: integrations.sustenaut.eu
      http:
        paths:
          - path: /logging
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  name: http
  tls:
    - hosts:
        - integrations.sustenaut.eu
