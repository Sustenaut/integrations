# The JavaScript clients and the docs: each client is what the committed spec gives
# (caller.js: what classes.json, the plugins and clients/js/src/caller.js give; storage.js
# and clients/storage_routes.py: what the vendored openapi/storage.json gives),
# passes its tests, and agrees with a mock of the spec, and the docs build.
name: clients

on:
  pull_request:
  merge_group:
  push: { branches: [main] }

permissions:
  contents: read

jobs:
  clients:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund
      # generate stops when openapi/storage.json isn't the file its lock pins; the
      # storage clients' routes, here and in Python, are then what that spec gives.
      - name: The clients are what the specs and the registry give
        run: |
          npm run --silent generate
          git diff --exit-code -- . ../../src/integrations/clients/storage_routes.py
      - run: npm test
      - name: The clients agree with a mock of the spec
        run: |
          npm run --silent mock -- --port 4010 > prism.log 2>&1 &
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:4010/ && break; sleep 1; done
          node test/mock.mjs http://127.0.0.1:4010
      - run: npm run --silent docs
