# Deploys workers/call-log, the call log's Durable Object for code on Cloudflare, with
# wrangler, after its tests. The token is the Actions secret CLOUDFLARE_WORKERS_GITHUB_TOKEN
# (a Cloudflare account token with the Workers Admin role on the whole Sustenaut account,
# by choice, so new Workers can be deployed without a new token), from the Bitwarden secret
# cloudflare-workers-github-token; without it nothing is deployed. As it can change any
# Worker in the account, it is this repository's secret alone, and this workflow never
# runs on a pull request.
name: call-log

on:
  push:
    branches: [main]
    paths: ["workers/call-log/**", "clients/js/caller.js", ".github/workflows/call-log.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: call-log
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - run: node --test clients/js/test/call-log.test.mjs
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_GITHUB_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::No CLOUDFLARE_WORKERS_GITHUB_TOKEN secret yet, so nothing is deployed."
            exit 0
          fi
          npx --yes wrangler@4.156.2 deploy --config workers/call-log/wrangler.toml
