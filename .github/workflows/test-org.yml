# The GitHub test org's janitor: daily, deletes the rec-* repositories a recording
# (integrations.testing.github) left behind, those made more than a day ago. A run
# deletes its own repositories as each scenario ends; this takes what a run cut
# short left, so nothing else in the test org may be named rec-*. It acts as the
# recorder app, installed on the test org only, with the token
# actions/create-github-app-token mints from its client id and key
# (TEST_RECORDER_APP_CLIENT_ID, a variable, which a secret of that name overrides,
# and TEST_RECORDER_APP_KEY, a secret, which `./with-secrets ./pubsec app-secrets`
# sends from pubrules.json's github_app block). Until the variable is there, it does
# nothing: a job's if cannot read secrets.
name: test-org

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-org
  cancel-in-progress: false

jobs:
  sweep:
    if: vars.TEST_RECORDER_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.14' }
      # Administration write on the test org's repositories, to delete them.
      - name: Mint the recorder app's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.TEST_RECORDER_APP_CLIENT_ID || vars.TEST_RECORDER_APP_CLIENT_ID }}
          private-key: ${{ secrets.TEST_RECORDER_APP_KEY }}
          owner: SustenautTest
          permission-administration: write
          permission-metadata: read
      - name: Delete the rec-* repositories older than a day
        run: bin/integrations test-org sweep --org SustenautTest --older-than-hours 24
        env:
          GITHUB_TEST_RECORDER_TOKEN: ${{ steps.app.outputs.token }}
