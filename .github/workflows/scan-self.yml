# This repository's own scan, with the scanner of the commit under test.
name: integrations

on:
  pull_request:
  merge_group:
  push: { branches: [main] }

permissions:
  contents: read

jobs:
  scan:
    uses: ./.github/workflows/scan.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
