# Compare a repository's calls to outside services with its integrations.json.
# A repository calls this, pinned by commit like every other reusable workflow:
#
#   jobs:
#     integrations:
#       uses: Sustenaut/integrations/.github/workflows/scan.yml@<commit> # main
#
# It runs the scanner at the commit the caller pinned, from a plain checkout:
# the scanner needs Python and nothing else, and no job here has secrets.
name: scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: repository, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Sustenaut/integrations
          ref: ${{ job.workflow_sha }}
          path: scanner
          persist-credentials: false
      - run: scanner/bin/integrations scan repository
