name: service-needs

on:
  workflow_dispatch:
    inputs:
      action:
        description: "check: each need's state, read-only; fulfil: the engine makes what is missing, once a person approves its plan"
        type: choice
        required: true
        default: check
        options: ["check", "fulfil"]
      unit:
        description: The deploy unit whose needs the convergence engine checks or fulfils
        type: choice
        required: true
        options: ["integrations"]

permissions:
  contents: read

jobs:
  service-needs:
    uses: Sustenaut/pubrules/.github/workflows/service-needs.yml@498c9185a45fc6edad74658740e66cd369a646a4 # v0.49.1
    with: {"unit": "${{ inputs.unit }}", "kind": "${{ inputs.action }}"}
    permissions:
      contents: read
      id-token: write
