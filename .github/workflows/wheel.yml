# Releases the version in pyproject.toml when it reaches main: the tag, the
# release and its wheel, once. A version already released does nothing.
name: wheel

on:
  push: { branches: [main] }

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.14' }
      - name: Release the version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          python -m pip wheel --quiet --no-deps . -w dist
          gh release create "v$version" "dist/integrations-$version-py3-none-any.whl" --target "$SHA" --title "integrations $version" --generate-notes
