# Builds the service's image once CI passes on a merge to main, and sends it to the
# shared k3s server over SSH and the tailnet, with pubkit's k8s-deploy.yml (pubkit's
# README, "Deploying a service to k3s"), where the deploy key can only run
# sustenaut-deploy.
#
# What a deployment serves is in repository variables, so nothing here names a
# consumer: INTEGRATIONS_EDIT_PR_REPOS, INTEGRATIONS_ORIGINS, INGEST_DATASETS and
# INGEST_SIGNALS (unset: no signals are loaded), which pubkit.json declares. Their
# values are kept in the owner's state repository: a change there sets them with
# `pubfleet variables --apply` and runs this workflow. Without SUSTENAUT_SERVER the image
# is built and pushed, and nothing is deployed. It deploys only once DEPLOY_INTEGRATIONS
# is "on", which the deploy walk sets once every need before it is ready.
name: deploy

on:
  # Once CI (main.yml) has passed on a merge to main, never beside it; k8s-deploy's
  # ready job also waits for the integrations check on that commit.
  workflow_run: { workflows: [main], types: [completed], branches: [main] }
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  deploy:
    uses: Sustenaut/pubdeploy/.github/workflows/k8s-deploy.yml@2df756eb5916723abb2d9fac9e3fd58e67693877 # v0.2.0
    with:
      image: ghcr.io/sustenaut/sustenaut-integrations
      deploys: k8s integrations DEPLOY_INTEGRATIONS
      # It starts, serves its docs and refuses a proposal without a token; the ingest pod's imports load.
      check: |
        docker run -d --name app -p 8080:8080 "$IMAGE"
        for _ in $(seq 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
        curl -fs localhost:8080/livez
        curl -fs localhost:8080/docs/ | grep -q 'Integrations service'
        test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/v1/github/edit-pr/proposals)" != 200
        docker rm -f app
        docker run --rm "$IMAGE" python -c 'import fastavro, cryptography, integrations.ingest.main'
      render: |
        var() { jq -r --arg name "$1" '.[$name] // ""' <<<"$VARS"; }
        kustomize edit add configmap settings \
          --from-literal="INTEGRATIONS_EDIT_PR_REPOS=$(var INTEGRATIONS_EDIT_PR_REPOS)" \
          --from-literal="INTEGRATIONS_ORIGINS=$(var INTEGRATIONS_ORIGINS)" \
          --from-literal="INGEST_DATASETS=$(var INGEST_DATASETS)"
        kustomize edit add configmap ingest-settings --from-literal="INGEST_DATASETS=$(var INGEST_DATASETS)" \
          --from-literal="INGEST_SIGNALS=$(var INGEST_SIGNALS)"
    secrets: inherit
